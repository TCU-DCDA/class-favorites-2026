<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Favorites Practice · WRIT 40363</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="practice.css">
</head>
<body>
  <header>
    <h1>Class Favorites Practice</h1>
    <p>Add a place and explain why you recommend it. Changes reset when you refresh.</p>
  </header>
  <main>
    <form id="add-favorite-form">
      <label for="name">Place name</label>
      <input id="name" name="name" type="text" required>

      <label for="category">Category</label>
      <select id="category" name="category" required>
        <option value="">Choose a category</option>
        <option value="dessert">Dessert</option>
        <option value="study">Study</option>
        <option value="coffee">Coffee</option>
        <option value="outdoors">Outdoors</option>
        <option value="food">Food</option>
      </select>

      <label for="why">Why do you recommend it?</label>
      <textarea id="why" name="why" rows="2" required></textarea>
      <button type="submit">Add Favorite</button>
    </form>

    <div id="favorites-list" aria-live="polite"></div>
  </main>

  <!-- Load exactly one dataset. Switch to favorites-clean.js for recovery. -->
  <script src="favorites-debug.js"></script>
  <script src="functions.js"></script>
</body>
</html>
